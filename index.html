<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiadores Yoiseth — Tiendas 40 / 46</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #ffffff;
    --bg-panel: #ffffff;
    --bg-panel-2: #f5f7f9;
    --line: #dde3ea;
    --text: #1a222c;
    --text-dim: #5b6b7a;
    --blue: #1c7fc4;
    --amber: #e08e1f;
    --red: #d1453b;
    --green: #2f9e5c;
    --price-gold: #e08e1f;
    --price-navy: #1d4ed8;
    --price-green: #1f8a45;
    --font-display: 'Barlow Condensed', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  h1,h2,h3,h4,.gauge-label,.tab-btn,.brand{font-family:var(--font-display);}
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  .app{max-width:1100px;margin:0 auto;padding:0 16px 60px;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 0 14px;border-bottom:2px solid var(--line);margin-bottom:18px;
    gap:12px;flex-wrap:wrap;
  }
  .brand{font-size:26px;font-weight:700;letter-spacing:0.3px;display:flex;align-items:center;gap:12px;}
  .brand img{height:44px;width:auto;display:block;}
  .brand span.accent{color:#12bb24;}
  .store-switch{display:flex;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .store-switch button{
    font-family:var(--font-display);font-size:18px;font-weight:600;
    background:transparent;border:none;color:var(--text-dim);padding:8px 18px;cursor:pointer;
  }
  .store-switch button.active{background:var(--blue);color:#08131c;}

  nav.tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--line);overflow-x:auto;}
  .tab-btn{
    background:transparent;border:none;color:var(--text-dim);font-size:17px;font-weight:600;
    padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;
  }
  .tab-btn.active{color:var(--text);border-bottom-color:var(--amber);}

  .panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
  .panel h2{margin:0 0 4px;font-size:24px;font-weight:600;}
  .panel .sub{color:var(--text-dim);font-size:14px;margin-bottom:16px;}

  label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:4px;margin-top:12px;}
  input,select,textarea{
    width:100%;background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:6px;font-size:15px;font-family:var(--font-body);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;}

  .row{display:grid;gap:12px;}
  .row.cols-2{grid-template-columns:1fr 1fr;}
  .row.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .row.cols-4{grid-template-columns:1fr 1fr 1fr 1fr;}
  @media (max-width:640px){
    .row.cols-2,.row.cols-3,.row.cols-4{grid-template-columns:1fr;}
  }

  .btn{
    font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:0.2px;
    border:none;border-radius:6px;padding:11px 20px;cursor:pointer;margin-top:16px;
  }
  .btn-primary{background:var(--amber);color:#241505;}
  .btn-secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn-danger{background:var(--red);color:#2a0808;}
  .btn-sm{padding:6px 12px;font-size:14px;margin-top:0;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;color:var(--text-dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;
     padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;}
  .badge-green{background:rgba(76,191,122,0.15);color:var(--green);}
  .badge-red{background:rgba(224,90,90,0.15);color:var(--red);}
  .badge-amber{background:rgba(242,163,61,0.15);color:var(--amber);}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  @media (max-width:640px){.stat-grid{grid-template-columns:1fr;}}
  .stat{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
  .stat .num{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1;}
  .stat .lbl{color:var(--text-dim);font-size:13px;margin-top:4px;}

  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .cart-item .name{flex:1;}
  .cart-item .qty-price{color:var(--text-dim);font-size:13px;}
  .cart-total{display:flex;justify-content:space-between;font-family:var(--font-display);font-size:22px;font-weight:700;padding-top:14px;}

  .price-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .price-pick button{
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;
    padding:8px 12px;cursor:pointer;font-size:14px;
  }
  .price-pick button.selected{border-color:var(--blue);background:rgba(46,168,230,0.15);}

  .search-results{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;margin-top:6px;}
  .search-row{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;}
  .search-row:hover{background:var(--bg-panel-2);}
  .search-row:last-child{border-bottom:none;}

  .empty{color:var(--text-dim);font-size:14px;padding:20px 0;text-align:center;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--green);color:#07230f;padding:12px 22px;border-radius:8px;font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,0.3);z-index:100;font-family:var(--font-body);
  }
  .toast.err{background:var(--red);color:#2a0808;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px;}
  .modal{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:420px;width:100%;}
  .flag{font-size:12px;color:var(--text-dim);}
  .divider{height:1px;background:var(--line);margin:18px 0;}
  .receipt{font-family:monospace;font-size:13px;white-space:pre-wrap;background:var(--bg-panel-2);padding:16px;border-radius:6px;border:1px solid var(--line);}
  .price-70{color:var(--price-gold);font-weight:600;}
  .price-85{color:var(--price-navy);font-weight:600;}
  .price-100{color:var(--price-green);font-weight:600;}
  th.price-70{color:var(--price-gold);}
  th.price-85{color:var(--price-navy);}
  th.price-100{color:var(--price-green);}
  .login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .login-box{background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;padding:32px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.08);}
  .login-box h2{margin-top:0;}
  .login-error{color:var(--red);font-size:14px;margin-top:10px;min-height:18px;}
  .role-badge{font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:10px;}
  .role-badge strong{color:var(--text);}
</style>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>Radiadores Yoiseth</h2>
    <div class="sub" style="margin-bottom:16px;">Inicia sesión para continuar</div>
    <label>Usuario</label>
    <input id="loginUsuario" placeholder="Ej: vendedor40" onkeydown="if(event.key==='Enter') iniciarSesion()">
    <label>Contraseña</label>
    <input id="loginPassword" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') iniciarSesion()">
    <button class="btn btn-primary" style="width:100%;" onclick="iniciarSesion()">Iniciar sesión</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<script>
/* ============ CONEXIÓN A SUPABASE ============ */
/* Reemplaza estos dos valores por los de tu propio proyecto de Supabase.
   Los encuentras en: Project Settings → API → Project URL / anon public key */
const SUPABASE_URL = 'https://wwuvypnrhjemkzwoxhuj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3dXZ5cG5yaGplbWt6d294aHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODY2MjIsImV4cCI6MjEwMzk2MjYyMn0.5T4JGawhbebKXZZBe2EpDLB_iT2tKz728W9toMf4uiU';
let sb = null;
let errorInicioSupabase = null;
try{
  if(!window.supabase) throw new Error('La librería de Supabase no cargó (window.supabase es undefined). Revisa tu conexión a internet o si un bloqueador de anuncios está bloqueando cdn.jsdelivr.net.');
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  errorInicioSupabase = e.message || String(e);
  console.error('Error creando cliente de Supabase:', e);
}

/* ============ ESTADO ============ */
let currentUser = null; // {usuario, rol: 'vendedor'|'gerente', tienda: '40'|'46'|null}
let currentStore = '40';
let productos = [];      // {id,nombre,proveedor,precio1..4,stock40,stock46}
let traslados = [];      // {id,fecha,productoId,nombre,usuario,cantidad,origen,destino}
let ventas = [];         // {id,tienda,numero,fecha,vendedor,metodoPago,cedulaCliente,items[],total,estado,tipo}
let contadores = {40:0, 46:0};
let usuarios = [];
let cart = []; // {productoId,nombre,cantidad,precioUnitario,observacion}

/* ============ AUTENTICACIÓN ============ */
async function hashTexto(texto){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function iniciarSesion(){
  const usuario = document.getElementById('loginUsuario').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  if(!usuario || !password){ errBox.textContent = 'Escribe usuario y contraseña.'; return; }
  if(!sb){ errBox.textContent = 'No se pudo conectar con la base de datos.'; return; }

  try{
    const hash = await hashTexto(password);
    const {data, error} = await sb.from('usuarios').select('*').eq('usuario', usuario).maybeSingle();
    if(error) throw error;
    if(!data || data.password_hash !== hash){
      errBox.textContent = 'Usuario o contraseña incorrectos.';
      return;
    }
    currentUser = { usuario: data.usuario, rol: data.rol, tienda: data.tienda };
    localStorage.setItem('sesion-usuario', JSON.stringify(currentUser));
    await entrarAlSistema();
  }catch(e){
    console.error(e);
    errBox.textContent = 'No se pudo verificar el usuario. Intenta de nuevo.';
  }
}
function cerrarSesion(){
  currentUser = null;
  localStorage.removeItem('sesion-usuario');
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginUsuario').value = '';
  document.getElementById('loginPassword').value = '';
}
function aplicarRestriccionesDeRol(){
  const esGerente = currentUser.rol === 'gerente';
  document.getElementById('tabAdministracion').style.display = esGerente ? '' : 'none';
  document.getElementById('btnStore40').style.display = esGerente ? '' : (currentUser.tienda==='40' ? '' : 'none');
  document.getElementById('btnStore46').style.display = esGerente ? '' : (currentUser.tienda==='46' ? '' : 'none');
  if(!esGerente){ currentStore = currentUser.tienda; }
  document.getElementById('roleBadge').innerHTML = `<strong>${currentUser.usuario}</strong> · ${esGerente ? 'Gerente' : 'Vendedor Tienda '+currentUser.tienda}`;
}
async function entrarAlSistema(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  aplicarRestriccionesDeRol();
  await loadAll();
  updateStoreButtons();
  document.querySelector('.tab-btn[data-tab="inicio"]').classList.add('active');
  render();
}

async function loadAll(){
  try{
    const {data, error} = await sb.from('productos').select('*');
    if(error) throw error;
    productos = data || [];
  }catch(e){ console.error('Error cargando productos:', e); productos = []; }
  try{
    const {data, error} = await sb.from('traslados').select('*').order('fecha', {ascending:true});
    if(error) throw error;
    traslados = data || [];
  }catch(e){ console.error('Error cargando traslados:', e); traslados = []; }
  try{
    const {data, error} = await sb.from('ventas').select('*').order('fecha', {ascending:true});
    if(error) throw error;
    ventas = data || [];
  }catch(e){ console.error('Error cargando ventas:', e); ventas = []; }
  try{
    const {data, error} = await sb.from('contadores').select('*');
    if(error) throw error;
    contadores = {40:0, 46:0};
    (data||[]).forEach(r => { contadores[r.tienda] = r.valor; });
  }catch(e){ console.error('Error cargando contadores:', e); contadores = {40:0,46:0}; }
  try{
    const s = localStorage.getItem('tienda-actual');
    if(s) currentStore = s;
  }catch(e){}
  try{
    const {data, error} = await sb.from('usuarios').select('usuario, rol, tienda');
    if(error) throw error;
    usuarios = data || [];
  }catch(e){ console.error('Error cargando usuarios:', e); usuarios = []; }
}
async function actualizarDatos(){
  await loadAll();
  updateStoreButtons();
  render();
  toast('Datos actualizados desde la base de datos.');
}

/* Funciones de guardado: cada una escribe solo lo que cambió */
async function upsertProducto(p){
  const {error} = await sb.from('productos').upsert(p);
  if(error){ console.error(error); toast('No se pudo guardar el producto en la base de datos.', true); }
}
async function upsertProductos(list){
  if(!list.length) return;
  const {error} = await sb.from('productos').upsert(list);
  if(error){ console.error(error); toast('No se pudieron guardar algunos productos.', true); }
}
async function insertTraslado(t){
  const {error} = await sb.from('traslados').insert(t);
  if(error){ console.error(error); toast('No se pudo guardar el traslado en la base de datos.', true); }
}
async function insertVenta(v){

function parseImportLine(line){
  const sep = line.includes('\t') ? '\t' : ',';
  const parts = line.split(sep).map(s=>s.trim());
  // Acepta 6 columnas (con ID, vacío si es producto nuevo) o 5 columnas (sin ID, siempre nuevo)
  let id, nombre, proveedor, costo, stock40, stock46;
  if(parts.length >= 6){
    [id, nombre, proveedor, costo, stock40, stock46] = parts;
  } else if(parts.length === 5){
    id = '';
    [nombre, proveedor, costo, stock40, stock46] = parts;
  } else {
    return null;
  }
  return {
    id: id || null,
    nombre: nombre || '',
    proveedor: proveedor || '',
    ...calcularPrecios(costo),
    stock40: parseInt(stock40)||0, stock46: parseInt(stock46)||0
  };
}
let importPendiente = [];
function previsualizarImportacion(){
  const raw = document.getElementById('importText').value.trim();

  const lineas = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  importPendiente = [];
  const errores = [];
  lineas.forEach((linea, i)=>{
    const row = parseImportLine(linea);
    if(!row || !row.nombre){ errores.push(`Fila ${i+1}: formato incompleto, se ignoró.`); return; }
    const existente = row.id ? productos.find(p=>p.id===row.id) : null;
    importPendiente.push({ row, accion: existente ? 'actualizar' : 'crear' });
  });
  document.getElementById('importPreview').innerHTML = `

        <tbody>
          ${importPendiente.map(x=>`
            <tr>
              <td><span class="badge ${x.accion==='crear'?'badge-green':'badge-amber'}">${x.accion}</span></td>
              <td>${x.row.id || '<span class="flag">se asigna</span>'}</td>
              <td>${x.row.nombre}</td><td>${x.row.proveedor||'—'}</td>
              <td>${fmtMoney(x.row.precio1)}</td>
              <td class="price-70">${fmtMoney(x.row.precio2)}</td>
              <td class="price-85">${fmtMoney(x.row.precio3)}</td>
              <td class="price-100">${fmtMoney(x.row.precio4)}</td>
              <td>${x.row.stock40}</td><td>${x.row.stock46}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    ${errores.length ? `<div class="flag" style="color:var(--red);margin-top:8px;">${errores.join('<br>')}</div>` : ''}
    <button class="btn btn-primary" onclick="confirmarImportacion()">Confirmar e importar ${importPendiente.length} producto(s)</button>
  `;
}
async function confirmarImportacion(){
  const listaParaGuardar = [];
  importPendiente.forEach(x=>{
    const r = x.row;
    if(x.accion==='actualizar'){
      const p = productos.find(pr=>pr.id===r.id);
      Object.assign(p, { nombre:r.nombre, proveedor:r.proveedor, precio1:r.precio1, precio2:r.precio2, precio3:r.precio3, precio4:r.precio4, stock40:r.stock40, stock46:r.stock46 });
      listaParaGuardar.push(p);
    } else {
      const nuevo = { id: r.id || ('P-'+uid().toUpperCase()), nombre:r.nombre, proveedor:r.proveedor, precio1:r.precio1, precio2:r.precio2, precio3:r.precio3, precio4:r.precio4, stock40:r.stock40, stock46:r.stock46 };
      productos.push(nuevo);
      listaParaGuardar.push(nuevo);
    }
  });
  await upsertProductos(listaParaGuardar);
  toast(`${importPendiente.length} producto(s) importado(s) correctamente.`);
  importPendiente = [];
  document.getElementById('importText').value = '';
  render();
}

async function registrarTraslado(){
  const productoId = document.getElementById('trProducto').value;
  const usuario = document.getElementById('trUsuario').value.trim();
  const origen = document.getElementById('trOrigen').value;
  const destino = document.getElementById('trDestino').value;
  const cantidad = parseInt(document.getElementById('trCantidad').value);

  if(!productoId){ toast('Selecciona un producto.', true); return; }
  if(!usuario){ toast('Escribe el nombre del usuario.', true); return; }
  if(origen === destino){ toast('El origen y el destino deben ser distintos.', true); return; }
  if(!cantidad || cantidad<=0){ toast('Ingresa una cantidad válida.', true); return; }

  const producto = productos.find(p=>p.id===productoId);
  const stockOrigen = producto['stock'+origen] || 0;
  if(cantidad > stockOrigen){
    toast(`No hay suficiente stock en Tienda ${origen} (disponible: ${stockOrigen}).`, true);
    return;
  }

  producto['stock'+origen] -= cantidad;
  producto['stock'+destino] = (producto['stock'+destino]||0) + cantidad;
  await upsertProducto(producto);

  const traslado = { id: uid(), fecha: new Date().toISOString(), productoId, nombre: producto.nombre, usuario, cantidad, origen, destino };
  traslados.push(traslado);
  await insertTraslado(traslado);

  toast(`Traslado registrado: ${cantidad} × "${producto.nombre}" de Tienda ${origen} a Tienda ${destino}.`);
  render();
}

  document.querySelectorAll('#pricePick button').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');

  precioActivo = val;

function agregarAlCarrito(){
  const p = productoSeleccionado;
  if(!p){ toast('Selecciona un producto primero.', true); return; }
  const cantidad = parseInt(document.getElementById('ventaCantidad').value);
  const obs = document.getElementById('ventaObs').value.trim();
  if(!cantidad || cantidad<=0){ toast('Ingresa una cantidad válida.', true); return; }
  if(!precioActivo){ toast('Selecciona un precio o escribe uno manual.', true); return; }

  const stockDisponible = p['stock'+currentStore] || 0;
  if(cantidad > stockDisponible && !obs){
    toast(`Solo hay ${stockDisponible} disponibles. Agrega una observación para continuar de todos modos.`, true);
    return;
  }

  cart.push({ productoId: p.id, nombre: p.nombre, cantidad, precioUnitario: precioActivo, observacion: obs });
  productoSeleccionado = null; precioActivo = null;
  document.getElementById('ventaSearch').value = '';
  document.getElementById('ventaSeleccion').innerHTML = '';
  render();
  toast('Producto agregado al carrito.');
}
function renderCart(){
  if(!cart.length) return '<div class="empty">El carrito está vacío. Busca un producto arriba para comenzar.</div>';
  const total = cart.reduce((s,i)=>s+i.cantidad*i.precioUnitario,0);
  return `
    ${cart.map((it,idx)=>`
      <div class="cart-item">
        <div class="name">${it.nombre} ${it.observacion?`<div class="flag">Obs: ${it.observacion}</div>`:''}</div>
        <div class="qty-price">${it.cantidad} × ${fmtMoney(it.precioUnitario)}</div>
        <div>${fmtMoney(it.cantidad*it.precioUnitario)}</div>
        <button class="btn btn-secondary btn-sm" onclick="quitarDelCarrito(${idx})">Quitar</button>
      </div>
    `).join('')}
    <div class="cart-total"><span>Total</span><span>${fmtMoney(total)}</span></div>
  `;
}
function quitarDelCarrito(idx){ cart.splice(idx,1); render(); }

async function cerrarVenta(){
  const vendedor = document.getElementById('ventaVendedor').value.trim();
  const metodoPago = document.getElementById('ventaPago').value;
  const cedulaCliente = document.getElementById('ventaCedula').value.trim();
  if(!vendedor){ toast('Escribe el nombre del vendedor.', true); return; }
  if(!cart.length){ toast('El carrito está vacío.', true); return; }

  // Descontar stock definitivamente
  const productosActualizados = [];
  for(const item of cart){
    const p = productos.find(pr=>pr.id===item.productoId);
    p['stock'+currentStore] = Math.max(0, (p['stock'+currentStore]||0) - item.cantidad);
    productosActualizados.push(p);
  }
  await upsertProductos(productosActualizados);

  // Toma el número de comprobante más reciente de la base de datos antes de asignar el siguiente,
  // para evitar que dos tiendas usen el mismo número si venden casi al mismo tiempo.
  let numeroActual = 0;
  try{
    const {data} = await sb.from('contadores').select('valor').eq('tienda', currentStore).maybeSingle();
    numeroActual = data ? data.valor : (contadores[currentStore]||0);
  }catch(e){ numeroActual = contadores[currentStore]||0; }
  contadores[currentStore] = numeroActual + 1;
  await upsertContador(currentStore, contadores[currentStore]);

  const total = cart.reduce((s,i)=>s+i.cantidad*i.precioUnitario,0);
  const venta = {
    id: uid(), tienda: currentStore, numero: contadores[currentStore],
    fecha: new Date().toISOString(), vendedor, metodoPago, cedulaCliente,
    items: cart.slice(), total, estado: 'activa', tipo: 'venta'
  };
  ventas.push(venta);
  await insertVenta(venta);

  cart = [];
  toast(`Venta #${venta.numero} confirmada — Tienda ${currentStore}.`);
  mostrarComprobante(venta);
}

function mostrarComprobante(venta){
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal">
      <h3>Comprobante #${venta.numero} — Tienda ${venta.tienda}</h3>
      <div class="receipt">${generarTextoComprobante(venta)}</div>
      <button class="btn btn-secondary" onclick="this.closest('.modal-bg').remove()">Cerrar</button>
      <button class="btn btn-primary" onclick="imprimirComprobante('${venta.id}')">Imprimir / PDF</button>
    </div>
  `;
  document.body.appendChild(modal);
}
function generarTextoComprobante(venta){
  let txt = `TIENDA ${venta.tienda}\nComprobante #${venta.numero}\nFecha: ${fmtDate(venta.fecha)}\nVendedor: ${venta.vendedor}\nPago: ${venta.metodoPago}${venta.cedulaCliente?`\nCliente (cédula): ${venta.cedulaCliente}`:''}\n\n`;
  venta.items.forEach(it=>{ txt += `${it.nombre}\n  ${it.cantidad} x ${fmtMoney(it.precioUnitario)} = ${fmtMoney(it.cantidad*it.precioUnitario)}\n`; });
  txt += `\nTOTAL: ${fmtMoney(venta.total)}`;
  return txt;
}
function imprimirComprobante(ventaId){
  const venta = ventas.find(v=>v.id===ventaId);
  const w = window.open('', '_blank');
  w.document.write(`<pre style="font-family:monospace;font-size:14px;">${generarTextoComprobante(venta)}</pre>`);
  w.document.close();
  w.print();
}

/* ============ REPORTES ============ */
function renderReportes(){
  return `
    <div class="panel">
      <h2>Inventario por proveedor</h2>
      <div class="sub">Existencias actuales agrupadas por proveedor</div>
      ${renderReporteProveedor()}
    </div>
    <div class="panel">
      <h2>Buscar venta por cédula del cliente</h2>
      <div class="sub">Busca en todas las tiendas y fechas</div>
      <input id="cedulaSearch" placeholder="Ej: V-12345678" oninput="renderCedulaSearch()">
      <div id="cedulaResults" style="margin-top:14px;"></div>
    </div>
    <div class="panel">
      <h2>Cierre de caja — Tienda ${currentStore}</h2>
      <div class="sub">Elige una fecha para ver el listado de ventas de esa tienda</div>
      <input id="repFecha" type="date" value="${new Date().toISOString().slice(0,10)}" oninput="renderReporteVentas()">
      <div id="repVentasBox" style="margin-top:14px;">${renderReporteVentasHTML(new Date().toISOString().slice(0,10))}</div>
    </div>
  `;
}
function renderReporteProveedor(){
  const grupos = {};
  productos.forEach(p=>{
    const prov = p.proveedor || 'Sin proveedor';
    if(!grupos[prov]) grupos[prov] = [];
    grupos[prov].push(p);
  });
  const keys = Object.keys(grupos);
  if(!keys.length) return '<div class="empty">Aún no hay productos registrados.</div>';
  return keys.map(prov=>`
    <h4 style="margin:16px 0 6px;">${prov}</h4>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Producto</th><th>Stock 40</th><th>Stock 46</th><th>Total</th></tr></thead>
        <tbody>
          ${grupos[prov].map(p=>`<tr><td>${p.nombre}</td><td>${p.stock40||0}</td><td>${p.stock46||0}</td><td>${(p.stock40||0)+(p.stock46||0)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
}
function renderCedulaSearch(){
  const q = document.getElementById('cedulaSearch').value.trim().toLowerCase();
  const box = document.getElementById('cedulaResults');
  if(!q){ box.innerHTML = ''; return; }
  const encontradas = ventas.filter(v => v.cedulaCliente && v.cedulaCliente.toLowerCase().includes(q));
  if(!encontradas.length){ box.innerHTML = '<div class="empty">No se encontraron ventas con esa cédula.</div>'; return; }
  box.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Tienda</th><th>#</th><th>Fecha</th><th>Vendedor</th><th>Total</th><th>Estado</th><th></th></tr></thead>
        <tbody>
          ${encontradas.map(v=>`
            <tr>
              <td>${v.tienda}</td><td>${v.numero}</td><td>${fmtDate(v.fecha)}</td><td>${v.vendedor}</td><td>${fmtMoney(v.total)}</td>
              <td><span class="badge ${v.estado==='activa'?'badge-green':'badge-red'}">${v.estado}</span></td>
              <td><button class="btn btn-secondary btn-sm" onclick="mostrarComprobante(ventas.find(x=>x.id==='${v.id}'))">Ver</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function renderReporteVentas(){
  const fecha = document.getElementById('repFecha').value;
  document.getElementById('repVentasBox').innerHTML = renderReporteVentasHTML(fecha);
}
function renderReporteVentasHTML(fecha){
  const delDia = ventas.filter(v => v.tienda===currentStore && new Date(v.fecha).toISOString().slice(0,10)===fecha);
  if(!delDia.length) return '<div class="empty">No hay movimientos para esta fecha en esta tienda.</div>';
  const totalActivas = delDia.filter(v=>v.tipo==='venta' && v.estado==='activa').reduce((s,v)=>s+v.total,0);
  return `
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Hora</th><th>Tipo</th><th>Vendedor</th><th>Pago</th><th>Total</th><th>Estado</th><th></th></tr></thead>
        <tbody>
          ${delDia.map(v=>`
            <tr>
              <td>${v.numero}</td><td>${fmtDate(v.fecha)}</td>
              <td>${v.tipo==='venta'?'Venta':'Devolución'}</td>
              <td>${v.vendedor}</td><td>${v.metodoPago}</td><td>${fmtMoney(v.total)}</td>
              <td><span class="badge ${v.estado==='activa'?'badge-green':v.estado==='anulada'?'badge-red':'badge-amber'}">${v.estado}</span></td>
              <td>
                ${v.tipo==='venta' && v.estado==='activa' ? `
                  <button class="btn btn-secondary btn-sm" onclick="anularVenta('${v.id}')">Anular</button>
                  <button class="btn btn-secondary btn-sm" onclick="mostrarComprobante(ventas.find(x=>x.id==='${v.id}'))">Ver</button>
                ` : `<button class="btn btn-secondary btn-sm" onclick="mostrarComprobante(ventas.find(x=>x.id==='${v.id}'))">Ver</button>`}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div class="cart-total"><span>Total del día</span><span>${fmtMoney(totalActivas)}</span></div>
  `;
}
async function anularVenta(ventaId){
  const venta = ventas.find(v=>v.id===ventaId);
  if(!venta || venta.estado!=='activa') return;
  if(!confirm(`¿Anular la venta #${venta.numero}? El producto regresará al depósito de Tienda ${venta.tienda}.`)) return;

  const productosActualizados = [];
  venta.items.forEach(item=>{
    const p = productos.find(pr=>pr.id===item.productoId);
    if(p){ p['stock'+venta.tienda] = (p['stock'+venta.tienda]||0) + item.cantidad; productosActualizados.push(p); }
  });
  venta.estado = 'anulada';
  await upsertProductos(productosActualizados);
  await updateVentaEstado(venta.id, 'anulada');
  toast(`Venta #${venta.numero} anulada. Stock devuelto a Tienda ${venta.tienda}.`);
  render();
}

/* ============ ADMINISTRACIÓN (solo Gerente) ============ */
function renderAdministracion(){
  return `
    <div class="panel" style="border-color:var(--amber);">
      <h2>Reiniciar stock de una tienda completa</h2>
      <div class="sub">Pone en 0 el stock de <strong>todos</strong> los productos en la tienda elegida. Úsalo solo para preparar el inventario real al iniciar el uso del programa — esta acción no se puede deshacer.</div>
      <div class="row cols-2">
        <div>
          <label>Tienda a reiniciar</label>
          <select id="admTiendaReset">
            <option value="40">Tienda 40</option>
            <option value="46">Tienda 46</option>
          </select>
        </div>
        <div>
          <label>Escribe REINICIAR para confirmar</label>
          <input id="admConfirmTexto" placeholder="REINICIAR">
        </div>
      </div>
      <button class="btn btn-danger" onclick="reiniciarStockTienda()">Reiniciar stock de esta tienda a cero</button>
    </div>

    <div class="panel">
      <h2>Ajustar el stock de un producto específico</h2>
      <div class="sub">Establece manualmente el stock exacto de un producto en una tienda (lo reemplaza, no lo suma). Útil para corregir un conteo puntual.</div>
      <div class="row cols-3">
        <div>
          <label>Producto</label>
          <select id="admProducto">
            <option value="">— Selecciona producto —</option>
            ${productos.map(p=>`<option value="${p.id}">${p.nombre} (Stock 40: ${p.stock40||0} / Stock 46: ${p.stock46||0})</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Tienda</label>
          <select id="admTiendaProducto">
            <option value="40">Tienda 40</option>
            <option value="46">Tienda 46</option>
          </select>
        </div>
        <div><label>Nuevo stock</label><input id="admNuevoStock" type="number" min="0"></div>
      </div>
      <button class="btn btn-primary" onclick="ajustarStockProducto()">Guardar nuevo stock</button>
    </div>

    <div class="panel">
      <h2>Usuarios del sistema</h2>
      <div class="sub">Crea usuarios nuevos o cambia una contraseña. Los cambios se guardan de inmediato.</div>
      <div class="table-wrap" style="margin-bottom:16px;">
        <table>
          <thead><tr><th>Usuario</th><th>Rol</th><th>Tienda</th></tr></thead>
          <tbody>
            ${usuarios.length ? usuarios.map(u=>`
              <tr><td>${u.usuario}</td><td>${u.rol==='gerente'?'Gerente':'Vendedor'}</td><td>${u.tienda||'—'}</td></tr>
            `).join('') : '<tr><td colspan="3" class="empty">No hay usuarios registrados todavía.</td></tr>'}
          </tbody>
        </table>
      </div>
      <div class="divider"></div>
      <div class="row cols-2">
        <div><label>Usuario (nombre para iniciar sesión)</label><input id="usrNombre" placeholder="Ej: vendedor40"></div>
        <div><label>Contraseña nueva</label><input id="usrPassword" type="password" placeholder="Mínimo 6 caracteres"></div>
      </div>
      <div class="row cols-2">
        <div>
          <label>Rol</label>
          <select id="usrRol" onchange="document.getElementById('usrTiendaBox').style.display = this.value==='vendedor' ? 'block' : 'none';">
            <option value="vendedor">Vendedor</option>
            <option value="gerente">Gerente</option>
          </select>
        </div>
        <div id="usrTiendaBox">
          <label>Tienda asignada</label>
          <select id="usrTienda">
            <option value="40">Tienda 40</option>
            <option value="46">Tienda 46</option>
          </select>
        </div>
      </div>
      <div class="flag">Si escribes el nombre de un usuario que ya existe, se actualiza su contraseña/rol/tienda. Si es nuevo, se crea.</div>
      <button class="btn btn-primary" onclick="guardarUsuario()">Guardar usuario</button>
    </div>
  `;
}
async function guardarUsuario(){
  const usuario = document.getElementById('usrNombre').value.trim().toLowerCase();
  const password = document.getElementById('usrPassword').value;
  const rol = document.getElementById('usrRol').value;
  const tienda = rol === 'vendedor' ? document.getElementById('usrTienda').value : null;

  if(!usuario){ toast('Escribe un nombre de usuario.', true); return; }
  if(!password || password.length < 6){ toast('La contraseña debe tener al menos 6 caracteres.', true); return; }

  const password_hash = await hashTexto(password);
  const {error} = await sb.from('usuarios').upsert({ usuario, password_hash, rol, tienda });
  if(error){ console.error(error); toast('No se pudo guardar el usuario.', true); return; }

  toast(`Usuario "${usuario}" guardado correctamente.`);
  document.getElementById('usrNombre').value = '';
  document.getElementById('usrPassword').value = '';
  const {data} = await sb.from('usuarios').select('usuario, rol, tienda');
  usuarios = data || [];
  render();
}
async function reiniciarStockTienda(){
  const tienda = document.getElementById('admTiendaReset').value;
  const confirmTexto = document.getElementById('admConfirmTexto').value.trim().toUpperCase();
  if(confirmTexto !== 'REINICIAR'){ toast('Escribe exactamente "REINICIAR" para confirmar.', true); return; }
  if(!confirm(`¿Seguro que quieres poner en 0 el stock de TODOS los productos en Tienda ${tienda}? Esta acción no se puede deshacer.`)) return;

  const actualizados = productos.map(p => { p['stock'+tienda] = 0; return p; });
  await upsertProductos(actualizados);
  toast(`Stock de Tienda ${tienda} reiniciado a cero para todos los productos.`);
  document.getElementById('admConfirmTexto').value = '';
  render();
}
async function ajustarStockProducto(){
  const productoId = document.getElementById('admProducto').value;
  const tienda = document.getElementById('admTiendaProducto').value;
  const nuevoStock = parseInt(document.getElementById('admNuevoStock').value);
  if(!productoId){ toast('Selecciona un producto.', true); return; }
  if(isNaN(nuevoStock) || nuevoStock < 0){ toast('Ingresa un valor de stock válido.', true); return; }

  const p = productos.find(pr=>pr.id===productoId);
  p['stock'+tienda] = nuevoStock;
  await upsertProducto(p);
  toast(`Stock de "${p.nombre}" en Tienda ${tienda} ajustado a ${nuevoStock}.`);
  render();
}

/* ============ INIT ============ */
function wireEvents(){
  const sel = document.getElementById('ingProducto');
  if(sel){
    sel.onchange = () => {
      document.getElementById('nuevoProductoFields').style.display = sel.value==='__nuevo__' ? 'block' : 'none';
    };
  }
}

function mostrarErrorFatal(mensaje){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  document.getElementById('content').innerHTML = `
    <div class="panel" style="border-color:var(--red);">
      <h2 style="color:var(--red);">No se pudo iniciar la aplicación</h2>
      <p>Copia este mensaje y envíaselo a Claude para revisarlo:</p>
      <div class="receipt" style="color:var(--red);">${mensaje}</div>
    </div>
  `;
}
window.addEventListener('error', (e) => {
  mostrarErrorFatal(e.message + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', (e) => {
  mostrarErrorFatal((e.reason && e.reason.message) ? e.reason.message : String(e.reason));
});

(async function init(){
  try{
    if(!sb){
      mostrarErrorFatal(errorInicioSupabase || 'No se pudo conectar con Supabase.');
      return;
    }
    const guardada = localStorage.getItem('sesion-usuario');
    if(guardada){
      currentUser = JSON.parse(guardada);
      await entrarAlSistema();
    }
  }catch(err){
    mostrarErrorFatal((err && err.message) ? err.message : String(err));
  }
})();
</script>
